name: Backend CI

on:
  push:
    branches: [ master, Ardasher ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sarfkor_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=sarfkor_ci;Username=postgres;Password=postgres"
      Jwt__Issuer: "sarfkor-ci"
      Jwt__Audience: "sarfkor-ci"
      Jwt__Key: "ci-only-placeholder-signing-key-not-used-in-prod-1234567890"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Backend/Backend.slnx

      - name: Build
        run: dotnet build Backend/Backend.slnx --no-restore --configuration Release

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.0-preview.7.25380.108

      - name: Apply migrations to CI database
        # No --no-build here: with it, dotnet-ef has to reconstruct the build
        # output path itself from --configuration/TFM, and on Linux the
        # preview EF tooling (10.0.0-preview.x) does that with a literal
        # backslash instead of the platform separator, producing a path like
        # bin\Release\net10.0\WebApi.deps.json that can never resolve
        # (dotnet/efcore#36142). Letting it build itself sidesteps the bug —
        # it gets the real output path straight from that build, not a
        # guessed one — at the cost of one redundant build in CI.
        run: >
          dotnet ef database update
          --project Backend/src/Infrastructure/Infrastructure.csproj
          --startup-project Backend/src/WebApi/WebApi.csproj
          --configuration Release

      - name: Test
        run: dotnet test Backend/tests/Application.Tests/Application.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"
